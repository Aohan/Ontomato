name: Images

# Formal releases publish three final images; deployments only pull and run them.
#
# develop pushes publish the edge version, formal v* tags publish the stripped
# version plus latest. Pull requests never publish: they run pr-checks.yml.
#
# Keep each ref's build, publication and verification together. The head check
# also rejects stale develop reruns; concurrency does not guarantee FIFO order.

on:
  push:
    branches: ["develop"]
    tags: ["v*"]

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/ontomato-ai

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check offline delivery
        run: python3 -B scripts/offline-mirror-test.py

      - name: Build the final images
        run: |
          BUILD_CACHE_REF="$REGISTRY/ontomato-workbench:latest" make workbench ARCH="$ARCH"
          BUILD_CACHE_REF="$REGISTRY/ontomato-data-engine:latest" make data-engine ARCH="$ARCH"
          BUILD_CACHE_REF="$REGISTRY/ontomato-ontology-manager:latest" make ontology-manager ARCH="$ARCH"

      - name: Start the stack
        id: stack-start
        working-directory: deploy
        run: |
          sed "s/^ARCH=.*/ARCH=$ARCH/" .env.example > .env
          docker pull pgvector/pgvector:pg18
          docker compose up -d --wait --wait-timeout 300
          for port in 3000 3005; do
            curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-all-errors \
              --output /dev/null "http://127.0.0.1:$port/"
          done

      - name: Show the stack state
        if: always() && steps['stack-start'].outcome != 'skipped'
        working-directory: deploy
        run: |
          docker compose ps -a
          docker compose logs --tail 200

      # Edge guard: an outdated develop run must not publish after the branch
      # has advanced. Release-tag builds do not track develop.
      - name: Refuse a stale edge publish
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then exit 0; fi
          head=$(git rev-parse HEAD)
          remote=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/develop | cut -f1)
          [ "$head" = "$remote" ] || {
            echo "develop has advanced to $remote; not publishing edge from stale $head" >&2
            exit 1
          }

      - name: Publish the images of this architecture
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version=edge; fi
          publish() {
            docker tag "$1" "$2"
            docker push "$2"
          }
          publish "ontomato:deploy-$ARCH" "$REGISTRY/ontomato-workbench:$version-$ARCH"
          publish "datarag-opensource:deploy-$ARCH" "$REGISTRY/ontomato-data-engine:$version-$ARCH"
          publish "ontomato-ontology-manager:deploy-$ARCH" "$REGISTRY/ontomato-ontology-manager:$version-$ARCH"

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse a stale edge publish
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then exit 0; fi
          remote=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/develop | cut -f1)
          [ "${{ github.sha }}" = "$remote" ] || {
            echo "develop has advanced to $remote; not indexing edge from stale ${{ github.sha }}" >&2
            exit 1
          }

      - name: Publish the multi-architecture images
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version=edge; fi
          # index <image> <amd64 tag> <arm64 tag>
          index() {
            local tags=(-t "$REGISTRY/$1:$version")
            if [ "$GITHUB_REF_TYPE" = tag ]; then tags+=(-t "$REGISTRY/$1:latest"); fi
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              "${tags[@]}" "$REGISTRY/$1:$2" "$REGISTRY/$1:$3"
          }
          for image in ontomato-workbench ontomato-data-engine ontomato-ontology-manager; do
            index "$image" "$version-amd64" "$version-arm64"
          done

  # The deployment path: pull the published final images and start the stack.
  verify:
    needs: manifest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack from the published images
        id: stack-start
        working-directory: deploy
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [ "$GITHUB_REF_TYPE" = tag ]; then export ONTOMATO_VERSION="${GITHUB_REF_NAME#v}"; else export ONTOMATO_VERSION=edge; fi
          sed "s/^ARCH=.*/ARCH=$ARCH/" .env.example > .env
          echo "COMPOSE_FILE=docker-compose.yml:docker-compose.ghcr.yml" >> .env
          docker compose up -d --wait --wait-timeout 300
          for port in 3000 3005; do
            curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-all-errors \
              --output /dev/null "http://127.0.0.1:$port/"
          done

      - name: Show the stack state
        if: always() && steps['stack-start'].outcome != 'skipped'
        working-directory: deploy
        run: |
          docker compose ps -a
          docker compose logs --tail 200
