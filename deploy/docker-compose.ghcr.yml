name: ${COMPOSE_PROJECT_NAME:-ontomato}

# Online stack: the same services and the same on-site assembly as docker-compose.yml,
# with the runtime, app and Ontology Manager images pulled from GitHub Container
# Registry instead of loaded from an offline bundle. Everything except the image source
# is inherited from docker-compose.yml. ARCH in .env must name this machine's
# architecture (amd64 or arm64): the assembly checks the images against it.

services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    pull_policy: missing

  datarag:
    extends:
      file: docker-compose.yml
      service: datarag
    build:
      args:
        RUNTIME_IMAGE: ghcr.io/aohan/ontomato-data-engine-runtime:${ONTOMATO_VERSION:-latest}
        APP_IMAGE: ghcr.io/aohan/ontomato-data-engine-app:${ONTOMATO_VERSION:-latest}

  ontomato:
    extends:
      file: docker-compose.yml
      service: ontomato
    build:
      args:
        RUNTIME_IMAGE: ghcr.io/aohan/ontomato-workbench-runtime:${ONTOMATO_VERSION:-latest}
        APP_IMAGE: ghcr.io/aohan/ontomato-workbench-app:${ONTOMATO_VERSION:-latest}

  ontology-manager:
    extends:
      file: docker-compose.yml
      service: ontology-manager
    image: ghcr.io/aohan/ontomato-ontology-manager:${ONTOMATO_VERSION:-latest}
    pull_policy: missing

volumes:
  postgres18_data:
