<!DOCTYPE html>
<html lang="">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite App</title>
    <style>
        .chat-container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background: white;
        }

        .chat-box {
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            background: #f9f9f9;
            border-radius: 4px;
        }

        .message {
            padding: 5px;
            margin: 5px 0;
        }

        .user-message {
            color: blue;
        }

        .ai-message {
            color: green;
        }

        input {
            width: 80%;
            padding: 8px;
            margin-right: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>


<body>
    <div class="chat-container">
        <h2>AI Chat</h2>
        <div class="chat-box" id="chat-box">
        </div>
        <input id="userInput" class="userInput" @keyup.enter="sendMessage" placeholder="Enter a message..." />
        <button id="sendBtn">Send</button>
    </div>
</body>
<script>
    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    function appendMessage(role, text) {
        const p = document.createElement("p");
        p.className = "message " + (role === "user" ? "user-message" : "ai-message");
        p.innerText = (role === "user" ? "👤 " : "🤖 ") + text;
        chatBox.appendChild(p);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const input = userInput.value.trim();
        if (!input) return;

        appendMessage("user", input);
        userInput.value = "";

        try {
            const randomSessionId = Math.floor(Math.random()*(199999-100000)+100000);
            const res = await fetch(`/chat?sessionId=${randomSessionId}&prompt=${encodeURIComponent(input)}`);
            const data = await res.text(); // Assume it returns JSON: { "result": "AI reply content" }

            // const eventSource = new EventSource(`/streamchat?sessionId=${randomSessionId}&prompt=${encodeURIComponent(input)}`);
            // eventSource.onmessage = (event) => {
            //     // Accumulate the output content
            //     // console.log(event.data);
            //     appendMessage("ai", event.data || "(no result returned)");
            // };
            //
            // eventSource.onerror = () => {
            //     eventSource.close();
            // };
            // eventSource.onopen = () => {
            //     // Output started
            //     console.log("Output started");
            // };
            appendMessage("ai", data || "(no result returned)");
        } catch (err) {
            appendMessage("ai", "❌ Request failed, please check the server connection.");
            console.error(err);
        }
    }

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keyup", (e) => {
        if (e.key === "Enter") sendMessage();
    });
</script>

</html>
