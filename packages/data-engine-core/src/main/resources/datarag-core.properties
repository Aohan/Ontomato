spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# PostgreSQL persistence configuration (migration target for business Daos; injected from environment variables, does not affect existing M3 logic when unset)
ontomato.data-engine.jdbc.url=${POSTGRE_JDBC_URL:}
ontomato.data-engine.jdbc.username=${POSTGRE_USER_NAME:}
ontomato.data-engine.jdbc.password=${POSTGRE_PASSWORD:}
ontomato.data-engine.jdbc.driver-class-name=${POSTGRE_DRIVER_CLASS:org.postgresql.Driver}
