spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# PostgreSQL persistence configuration (migration target for business Daos; injected from environment variables, does not affect existing M3 logic when unset)
ontomato.datarag.jdbc.url=${POSTGRE_JDBC_URL:}
ontomato.datarag.jdbc.username=${POSTGRE_USER_NAME:}
ontomato.datarag.jdbc.password=${POSTGRE_PASSWORD:}
ontomato.datarag.jdbc.driver-class-name=${POSTGRE_DRIVER_CLASS:org.postgresql.Driver}
